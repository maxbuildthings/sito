<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Foto del profilo Instagram: il sole della favicon del sito, in grande. Instagram la taglia a cerchio: tutto quello che conta sta nel cerchio centrale. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140536"/>
      <stop offset=".55" stop-color="#3a0b63"/>
      <stop offset=".62" stop-color="#6a1470"/>
    </linearGradient>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset=".45" stop-color="#ff8fa8"/>
      <stop offset="1" stop-color="#ff3fb4"/>
    </linearGradient>
    <linearGradient id="suolo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0650"/>
      <stop offset="1" stop-color="#0b0220"/>
    </linearGradient>
    <filter id="alone" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="taglio">
      <!-- il sole a strisce: le bande scure si allargano verso il basso -->
      <rect x="0" y="0" width="1080" height="500"/>
      <rect x="0" y="516" width="1080" height="34"/>
      <rect x="0" y="566" width="1080" height="28"/>
      <rect x="0" y="612" width="1080" height="22"/>
      <rect x="0" y="654" width="1080" height="16"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1080" fill="url(#cielo)"/>

  <!-- stelle -->
  <g fill="#fff" opacity=".8">
    <circle cx="210" cy="190" r="3"/><circle cx="330" cy="120" r="2"/><circle cx="820" cy="160" r="3"/>
    <circle cx="900" cy="290" r="2"/><circle cx="160" cy="360" r="2"/><circle cx="700" cy="90" r="2"/>
    <circle cx="450" cy="200" r="2"/><circle cx="960" cy="420" r="2"/>
  </g>

  <!-- alone e sole -->
  <circle cx="540" cy="470" r="300" fill="#ff5fc1" opacity=".55" filter="url(#alone)"/>
  <circle cx="540" cy="470" r="270" fill="url(#sole)" clip-path="url(#taglio)"/>

  <!-- suolo con la griglia al neon -->
  <rect x="0" y="690" width="1080" height="390" fill="url(#suolo)"/>
  <g stroke="#45f0ff" stroke-width="5" fill="none" filter="url(#neon)" stroke-linecap="round">
    <path d="M0 690H1080"/>
    <path d="M0 730H1080" opacity=".9"/>
    <path d="M0 790H1080" opacity=".85"/>
    <path d="M0 875H1080" opacity=".8"/>
    <path d="M0 1000H1080" opacity=".75"/>
    <path d="M540 690V1080"/>
    <path d="M470 690L300 1080"/><path d="M610 690L780 1080"/>
    <path d="M400 690L40 1080"/><path d="M680 690L1040 1080"/>
    <path d="M330 690L-240 1080"/><path d="M750 690L1320 1080"/>
  </g>
</svg>
